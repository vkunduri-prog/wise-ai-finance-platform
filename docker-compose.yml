services:
  mysql:
    image: mysql:8.4
    container_name: finpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: finpilot
      MYSQL_USER: finpilot
      MYSQL_PASSWORD: finpilot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
